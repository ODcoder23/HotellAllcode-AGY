const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const diffDays = (a, b) => Math.round((startOfDay(a) - startOfDay(b)) / 86400000);
/**
 * Sana → "YYYY-MM-DD", MAHALLIY kun bo'yicha (ISH_REJASI.md S2).
 *
 * `toISOString()` ishlatilmaydi: u UTC bo'yicha yozadi. Toshkentda
 * (UTC+5) mahalliy yarim tun UTC bo'yicha kechagi kun 19:00, shuning
 * uchun `toKey(fromKey("2026-09-25"))` "2026-09-24" qaytarardi —
 * bo'sh katak bosilganda oyna bir kun erta sanani ko'rsatardi.
 * `fromKey` ham mahalliy kunni yasaydi, ikkalasi bir-birini
 * aynan qaytarishi shart.
 */
const toKey = (d) => {
  const x = new Date(d);
  const mm = String(x.getMonth() + 1).padStart(2, "0");
  const dd = String(x.getDate()).padStart(2, "0");
  return `${x.getFullYear()}-${mm}-${dd}`;
};
const fromKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const UZ_MONTHS_SHORT = ["Yan", "Fev", "Mar", "Apr", "May", "Iyun", "Iyul", "Avg", "Sen", "Okt", "Noy", "Dek"];
const UZ_WEEKDAYS_SHORT = ["Yak", "Dush", "Sesh", "Chor", "Pay", "Jum", "Shan"];
const fmtShort = (d) => `${String(d.getDate()).padStart(2, "0")} ${UZ_MONTHS_SHORT[d.getMonth()]}`;
const fmtWeekday = (d) => UZ_WEEKDAYS_SHORT[d.getDay()];
const isSameDay = (a, b) => toKey(a) === toKey(b);
const nightsBetween = (ci, co) => Math.max(1, diffDays(co, ci));
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
// Valyuta (egasi qarori Q15): tizim SO'MDA — "450 000 so'm". Faqat
// Beds24'dan kelgan bron dollarda ("$1,250.50") va tagida so'm (bron
// kelgan kundagi kurs, backend `res.base`) — <Amount /> komponenti.
// Backend lib/money.ts formatMoney bilan bir xil.
const money = (n, currency) => {
  const v = Number(n);
  const x = Number.isFinite(v) ? v : 0;
  const cur = String(currency || "UZS").toUpperCase();
  if (cur === "UZS") return Math.round(x).toLocaleString("ru-RU").replace(/[\u00a0\u202f]/g, " ") + " so'm";
  const s = Math.abs(x).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const sign = x < 0 ? "-" : "";
  return cur === "USD" ? sign + "$" + s : sign + s + " " + cur;
};
// Sentda hisoblash — 0.1 + 0.2 kabi float qoldig'i "qarz $0.00" ni
// qizil qilib qo'ymasin (backend lib/money.ts bilan bir xil qoida)
const toCents = (n) => { const v = Number(n) || 0; return Math.sign(v) * Math.round(Math.abs(v) * 100 + 1e-7); };
const round2 = (n) => toCents(n) / 100;
const sumMoney = (arr) => arr.reduce((c, v) => c + toCents(v), 0) / 100;
/* Bron summasi — BACKENDDAN (serializeReservation, lib/money.ts):
   xona + nonushta + xizmatlar; bekor qilingan bron = jarima.
   Mahalliy hisob faqat eski javob uchun zaxira. */
function resMoney(res) {
  const nights = res.nights || nightsBetween(fromKey(res.checkIn), fromKey(res.checkOut));
  const chargesTotal = sumMoney((res.charges || []).map((c) => c.amount));
  const roomTotal = res.roomTotal != null ? res.roomTotal : round2(res.pricePerNight * nights);
  const mealTotal = res.mealTotal || 0;
  const total = res.totalPrice != null ? res.totalPrice : sumMoney([roomTotal, mealTotal, chargesTotal]);
  const paid = res.paidAmount != null ? res.paidAmount : sumMoney((res.payments || []).map((p) => p.amount));
  const remaining = res.remainingAmount != null ? res.remainingAmount : Math.max(0, (toCents(total) - toCents(paid)) / 100);
  const refundDue = res.refundDue != null ? res.refundDue : Math.max(0, (toCents(paid) - toCents(total)) / 100);
  return { nights, roomTotal, mealTotal, chargesTotal, total, paid, remaining, refundDue };
}

const API_BASE = window.API_BASE ?? "";

/**
 * JWT token — auth yoqilganda kerak (TZ 18-band).
 *
 * Brauzerning `WebSocket` API'si maxsus sarlavha yubora olmaydi,
 * shuning uchun token URL parametri orqali beriladi.
 *
 * Hozircha `window.AUTH_TOKEN` dan olinadi — Shaxmatka login
 * ekranisiz ishlaydi va dev muhitida `AUTH_REQUIRED=false`.
 * Login qo'shilganda bu yer o'zgarmaydi: token o'sha o'zgaruvchiga
 * yoziladi.
 */
function getAuthToken() {
  try {
    return window.AUTH_TOKEN || localStorage.getItem("pms_token") || "";
  } catch {
    return window.AUTH_TOKEN || "";
  }
}

class ApiError extends Error {
  constructor(message, status, code) {
    super(message);
    this.status = status;
    this.code = code;
  }
}

async function apiFetch(path, options = {}) {
  let res;
  try {
    const token = getAuthToken();
    res = await fetch(`${API_BASE}${path}`, {
      ...options,
      headers: {
        "Content-Type": "application/json",
        // Auth yoqilganda barcha /api/* so'rovlar token talab qiladi
        ...(token ? { Authorization: `Bearer ${token}` } : {}),
        ...(options.headers || {}),
      },
    });
  } catch (e) {
    throw new ApiError("Serverga ulanib bo'lmadi. Internetni tekshiring.", 0, "NETWORK");
  }

  if (res.status === 204) return null;

  let body;
  try {
    body = await res.json();
  } catch {
    throw new ApiError("Serverdan noto'g'ri javob keldi.", res.status, "BAD_RESPONSE");
  }

  if (!res.ok) {
    throw new ApiError(body?.error || "Noma'lum xato", res.status, body?.code);
  }
  return body;
}

  fxRate: (currency) => apiFetch(`/api/reservations/fx-rate?currency=${encodeURIComponent(currency || "USD")}`),
  // Beds24'ga yetmagan bronni qayta yuborish — egasi, admin (channel.write)
  resyncReservation: (id) => apiFetch(`/api/reservations/${id}/resync`, { method: "POST" }),
  // Bronni Beds24'dagi holatga keltirish (TZ 14-band getBooking) — egasi, admin
  refreshFromChannel: (id) => apiFetch(`/api/reservations/${id}/channel-refresh`, { method: "POST" }),
  // Qaysi tariflar Beds24'ga bog'langan — narx belgilaydiganlarga (channel.read)
  channelMapping: () => apiFetch("/api/admin/mapping"),
};

/**
 * Beds24 ulanganmi va foydalanuvchi bronni qayta yubora oladimi — sahifa
 * ochilganda bir marta so'raladi.
 *
 * Faqat KO'RINISH uchun: sinxron belgilari Beds24 ulangan bo'lsagina,
 * "Qayta yuborish" — egasi va adminga. Himoya backendda (channel.write).
 */
const CHANNEL_READ_ROLES = ["FOUNDER", "ADMIN", "MANAGER"];
const CHANNEL_WRITE_ROLES = ["FOUNDER", "ADMIN"];
let mePromise = null;
let channelPromise = null;
let mappingPromise = null;
function useChannel() {
  const [state, setState] = useState({ connected: false, canResync: false, rate: null, mappedTypes: new Set() });
  useEffect(() => {
    mePromise = mePromise || api.me().catch(() => null);
    channelPromise = channelPromise || api.fxRate("USD").catch(() => null);
    let alive = true;
    Promise.all([mePromise, channelPromise]).then(async ([me, fx]) => {
      const role = me?.user?.role;
      const connected = !!fx?.channelConnected;
      // Bog'langan tariflar (tur yoki xonasi orqali) — faqat shularning narxi Beds24'ga ketadi
      if (connected && CHANNEL_READ_ROLES.includes(role)) mappingPromise = mappingPromise || api.channelMapping().catch(() => null);
      const m = mappingPromise ? await mappingPromise : null;
      if (!alive) return;
      setState({
        connected,
        rate: fx?.rate ?? null,
        canResync: CHANNEL_WRITE_ROLES.includes(role),
        mappedTypes: new Set((m?.mappings || []).map((x) => x.roomTypeId).filter(Boolean)),
      });
    });
    return () => { alive = false; };
  }, []);
  return state;
}

/* ========================================================================
   REAL-TIME (WebSocket)

   Manba: TZ 4, 15-band

   TZ 4: "Admin sahifani refresh qilmasdan ham yangi bronni ko'rishi
   uchun WebSocket/real-time update ishlatilsin."

   MUHIM PRINTSIP: WebSocket faqat "delta" yetkazish
   vositasi, HAQIQAT MANBAI EMAS. Ulanish uzilganda o'tkazib
   yuborilgan event'lar bo'ladi, shuning uchun qayta ulanganda
   to'liq `reload()` chaqiriladi.

   Server tomon payload'ni `serializeReservation` bilan yuboradi —
   ayni `api.reservations()` qaytaradigan shakl. Shuning uchun
   konvertatsiya kerak emas: to'g'ridan-to'g'ri massivga qo'shamiz.
======================================================================== */

// API_BASE bo'sh bo'lsa (nisbiy rejim) WebSocket manzili sahifaning
// o'z origin'idan quriladi: https -> wss, http -> ws.
const WS_URL = (
  window.WS_URL
  || (API_BASE
        ? API_BASE.replace(/^http/, "ws")
        : location.origin.replace(/^http/, "ws"))
) + "/ws";


/**
 * Avtomatik qayta ulanadigan WebSocket.
 *
 * Qayta ulanish: 1s, 2s, 4s ... 30s gacha (exponential backoff).
 * Server qayta ishga tushganda darhol bosim bermaslik uchun jitter.
 */
function createRealtimeClient({ onEvent, onStatus }) {
  let ws = null;
  let closed = false;
  let attempt = 0;
  let timer = null;
  /** Server qayta ishga tushganini aniqlash uchun */
  let lastServerStartedAt = null;

  function connect() {
    if (closed) return;

    try {
      const token = getAuthToken();
      ws = new WebSocket(token ? `${WS_URL}?token=${encodeURIComponent(token)}` : WS_URL);
    } catch {
      scheduleReconnect();
      return;
    }

    ws.onopen = () => {
      attempt = 0;
      onStatus("online");
    };

    ws.onmessage = (ev) => {
      if (ev.data === "pong") return;

      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }

      // Ulanish tasdig'i. Agar server ID o'zgargan bo'lsa — restart
      // yoki uzoq uzilish: o'tkazib yuborilgan event'lar bor,
      // to'liq qayta yuklash kerak.
      if (msg.type === "connected") {
        const restarted = lastServerStartedAt && lastServerStartedAt !== msg.serverStartedAt;
        lastServerStartedAt = msg.serverStartedAt;
        if (restarted) onEvent({ type: "__resync" });
        return;
      }

      onEvent(msg);
    };

    ws.onclose = () => {
      onStatus("offline");
      scheduleReconnect();
    };

    ws.onerror = () => {
      // onclose baribir chaqiriladi — shu yerda hech narsa qilmaymiz
    };
  }

  function scheduleReconnect() {
    if (closed || timer) return;
    const delay = Math.min(1000 * 2 ** attempt, 30000) + Math.random() * 500;
    attempt++;
    timer = setTimeout(() => { timer = null; connect(); }, delay);
  }

  connect();

  return {
    close() {
      closed = true;
      if (timer) clearTimeout(timer);
      if (ws) { ws.onclose = null; ws.close(); }
    },
  };
}

/* ==========================================================================
   LOGIN EKRANI — TZ 18-band

   JWT autentifikatsiya (TZ 18-band)

   NEGA KERAK: `AUTH_REQUIRED=true` bo'lganda barcha `/api/*` so'rovlar
   token talab qiladi. Usiz Shaxmatka "Kirish talab qilinadi" xatosini
   ko'rsatib to'xtab qolardi va token olish yo'li bo'lmasdi.

   Dev muhitida (`AUTH_REQUIRED=false`) bu ekran KO'RINMAYDI: birinchi
   so'rov muvaffaqiyatli o'tadi va login talab qilinmaydi.

   Token `localStorage` da saqlanadi — sahifa yangilanganda qayta
   kirish shart emas. Muddati tugasa (12 soat) keyingi so'rov 401
   beradi va ekran o'zi qaytadi.
========================================================================== */

function LoginScreen({ onSuccess }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e?.preventDefault();
    if (!email || !password) return;

    setBusy(true);
    setError(null);
    try {
      const res = await api.login(email, password);
      try {
        localStorage.setItem("pms_token", res.token);
      } catch {
        // Shaxsiy rejim yoki bloklangan saqlash — token faqat
        // shu sessiyada ishlaydi
        window.AUTH_TOKEN = res.token;
      }
      onSuccess(res.user);
    } catch (err) {
      // Server ataylab bir xil xabar beradi: qaysi email mavjudligi
      // oshkor qilinmaydi
      setError(err.message || "Kirish amalga oshmadi");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="h-screen w-full flex items-center justify-center bg-gray-50">
      <form onSubmit={submit} className="w-80 bg-white border border-gray-200 rounded-lg shadow-sm p-5 space-y-4">
        <div className="flex items-center gap-2">
          <div className="h-8 w-8 rounded-md bg-blue-600 flex items-center justify-center text-white font-bold text-xs">SH</div>
          <div>
            <div className="text-sm font-semibold text-gray-800">Shaxmatka</div>
            <div className="text-xs text-gray-500">Imron Hotel PMS</div>
          </div>
        </div>

        <Field label="Email">
          <TextInput
            type="email" value={email} autoFocus
            onChange={(e) => setEmail(e.target.value)}
            placeholder="admin@imron.local"
          />
        </Field>

        <Field label="Parol">
          <TextInput
            type="password" value={password}
            onChange={(e) => setPassword(e.target.value)}
            placeholder="••••••••"
          />
        </Field>

        {error && (
          <div className="rounded-md bg-red-50 border border-red-200 px-2 py-1.5 text-xs text-red-700">
            {error}
          </div>
        )}

        <Btn variant="primary" className="w-full justify-center" type="submit" disabled={busy}>
          {busy ? "Kirilmoqda…" : "Kirish"}
        </Btn>
      </form>
    </div>
  );
}

/* ============================== APP ============================== */

function App() {
  const today = useMemo(() => startOfDay(new Date()), []);

  // Ma'lumot backenddan keladi
  const [rooms, setRooms] = useState([]);
  const [reservations, setReservations] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  /**
   * Kirish talab qilinadimi (TZ 18-band).
   *
   * Birinchi so'rov 401 bersa `true` bo'ladi va login ekrani
   * ko'rsatiladi. Dev muhitida (`AUTH_REQUIRED=false`) hech qachon
   * yoqilmaydi.
   */
  const [needsLogin, setNeedsLogin] = useState(false);

  const [viewStart, setViewStart] = useState(addDays(today, -1));
  const [rangeLen, setRangeLen] = useState(14);
  const [zoomIdx, setZoomIdx] = useState(2);
  const cellWidth = ZOOM_LEVELS[zoomIdx];

  const [search, setSearch] = useState("");
  const [filters, setFilters] = useState({ floor: "all", type: "all", status: "all", source: "all", resStatus: "all" });
  const [filtersOpen, setFiltersOpen] = useState(false);

  /**
   * Xona turlari bo'yicha JORIY narx — `RatePlan` dan.
   *
   * Q8: avtomatik o'suvchi formula olib tashlandi. Narxni admin
   * Narxlar panelida qo'lda belgilaydi, bu yerda faqat o'qiladi
   * (yangi bron uchun taklif narxi sifatida).
   */
  const [typePrices, setTypePrices] = useState({});
  const [pricingOpen, setPricingOpen] = useState(false);

  const [detailId, setDetailId] = useState(null);
  const [createDraft, setCreateDraft] = useState(null); // {roomId, checkIn, checkOut}
  const [subPanel, setSubPanel] = useState(null); // 'payment' | 'changeRoom' | 'changeDates' | 'checkout' | 'charge'
  // Bekor qilish jarimasi ogohlantirishi
  const [cancelPrompt, setCancelPrompt] = useState(null);
  const [roomMenu, setRoomMenu] = useState(null); // {roomId, x, y}
  const [conflictMsg, setConflictMsg] = useState(null);
  /** 'online' | 'offline' — real-time ulanish holati */
  const [wsStatus, setWsStatus] = useState("offline");

  const gridRef = useRef(null);

  const days = useMemo(() => Array.from({ length: rangeLen }, (_, i) => addDays(viewStart, i)), [viewStart, rangeLen]);

  /* ------------------------------ ma'lumot yuklash ------------------------------ */

  const reload = useCallback(async () => {
    try {
      const todayKey = toKey(today);
      const [roomsData, resData, rateRows, typeRows] = await Promise.all([
        api.rooms(),
        api.reservations(),
        // Bugungi narxlar — yangi bron uchun taklif (Q8)
        api.ratePlans(todayKey, todayKey).catch(() => []),
        // Xona turlari — nomi va koeffitsienti (yuqoridagi ROOM_TYPES)
        api.roomTypes().catch(() => []),
      ]);

      // ROOM_TYPES ni o'rnida to'ldiramiz: obyekt havolasi o'zgarmaydi,
      // shuning uchun uni o'qiydigan komponentlar tegilmaydi.
      if (Array.isArray(typeRows) && typeRows.length > 0) {
        for (const k of Object.keys(ROOM_TYPES)) delete ROOM_TYPES[k];
        for (const t of typeRows) {
          ROOM_TYPES[t.id] = { label: t.label, multiplier: t.multiplier ?? 1 };
        }
      }

      setRooms(roomsData);
      setReservations(resData);

      const prices = {};
      for (const r of rateRows) prices[r.roomTypeId] = r.price;
      setTypePrices(prices);

      setLoadError(null);
    } catch (e) {
      if (e.status === 401) {
        // Token yo'q yoki muddati tugagan — login ekrani
        setNeedsLogin(true);
        setLoadError(null);
      } else {
        setLoadError(e.message);
      }
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { reload(); }, [reload]);

  /**
   * Yopiq kunlar — ta'mir va Beds24 `black` (`RoomDayStatus.isBlocked`).
   *
   * Ilgari Shaxmatka ularni umuman o'qimasdi: xodim yopiq kunga bron
   * qilmoqchi bo'lib, backenddan rad olardi. Endi katak chiziqli
   * ko'rinadi va `isRoomAvailable` uni band deb biladi.
   *
   * Oraliq: ko'rinib turgan kunlar + bir yil oldinga — yangi bron
   * oynasida sana jadvaldan tashqarida tanlanishi mumkin. Faqat yopiq
   * kunlar qaytadi, shuning uchun javob kichik.
   */
  const [blocks, setBlocks] = useState(() => new Map());
  const blockFrom = toKey(viewStart < today ? viewStart : today);
  const blockTo = toKey(addDays(viewStart > today ? viewStart : today, rangeLen + 366));

  const loadBlocks = useCallback(async () => {
    try {
      const rows = await api.roomBlocks(blockFrom, blockTo);
      const m = new Map();
      for (const b of rows) m.set(blockKey(b.roomId, b.date), b.reason || "Yopiq");
      setBlocks(m);
    } catch { /* jim — bron baribir backendda tekshiriladi */ }
  }, [blockFrom, blockTo]);

  useEffect(() => {
    if (!loading && !needsLogin) loadBlocks();
  }, [loadBlocks, loading, needsLogin]);

  /**
   * Realtime'dan chaqirish uchun ref: `handleRealtime` o'zgarsa WebSocket
   * qayta ulanadi, shuning uchun u `loadBlocks` ga bog'lanmaydi. Bir
   * nechta event ketma-ket kelsa bitta so'rov ketadi.
   */
  const loadBlocksRef = useRef(loadBlocks);
  loadBlocksRef.current = loadBlocks;
  const blocksTimer = useRef(null);
  const scheduleBlocksReload = useCallback(() => {
    clearTimeout(blocksTimer.current);
    blocksTimer.current = setTimeout(() => loadBlocksRef.current(), 300);
  }, []);

  /**
   * API xatosini foydalanuvchiga ko'rsatadi.
   * 409 (xona band) — mavjud conflictMsg mexanizmi orqali,
   * boshqalari ham shu yerda.
   */
  const handleApiError = useCallback((e) => {
    setConflictMsg(e.message || "Amalni bajarib bo'lmadi.");
  }, []);

  const openCreate = useCallback((draft) => setCreateDraft(draft), []);

  /** Bitta bronni javobdagi yangi holat bilan almashtiradi */
  const applyReservation = useCallback((updated) => {
    setReservations((rs) => {
      const i = rs.findIndex((r) => r.id === updated.id);
      return i === -1 ? [...rs, updated] : rs.map((r) => (r.id === updated.id ? updated : r));
    });
  }, []);

  /** Xona holatlari server tomonda hisoblanadi — qayta o'qiymiz */
  const refreshRooms = useCallback(async () => {
    try { setRooms(await api.rooms()); } catch { /* jim — asosiy amal bajarilgan */ }
  }, []);

  /* ------------------------------ real-time event'lar ------------------------------ */

  /**
   * Server event'ini ekranga qo'llaydi.
   *
   * TZ 15-band talab qilgan
   * oltita event. Payload `api.reservations()` shakli bilan aynan
   * bir xil, shuning uchun `applyReservation` to'g'ridan-to'g'ri
   * ishlaydi.
   *
   * MUHIM: event o'z amalimizdan ham qaytib keladi (biz bron
   * yaratsak, server hammaga yuboradi — bizga ham). Bu muammo
   * emas: `applyReservation` id bo'yicha almashtiradi, dublikat
   * yaratmaydi. Natija — bir xil, faqat qayta yozilgan.
   */
  const handleRealtime = useCallback((msg) => {
    switch (msg.type) {
      // Uzoq uzilishdan keyin — o'tkazib yuborilgan event'lar bor
      case "__resync":
        reload();
        scheduleBlocksReload();
        break;

      case "reservation.created":
      case "reservation.updated":
        applyReservation(msg.reservation);
        if (msg.room) setRooms((rs) => rs.map((r) => (r.id === msg.room.id ? msg.room : r)));
        break;

      case "reservation.cancelled":
        // Bron massivda QOLADI, statusi 'cancelled' bo'ladi —
        // TZ 2-band: tarix o'chirilmaydi. Grid esa bekor
        // qilinganlarni ko'rsatmaydi (pastdagi filtr), shuning
        // uchun xona bo'shab ko'rinadi. Filtr "Bekor qilingan"ga
        // qo'yilsa bron yana ko'rinadi.
        applyReservation(msg.reservation);
        if (msg.room) setRooms((rs) => rs.map((r) => (r.id === msg.room.id ? msg.room : r)));
        break;

      case "payment.updated":
        // To'lov holati yangilanadi: kartochkadagi qarz summasi
        // va detail modaldagi 'Qoldiq' qatori (TZ 14-band)
        applyReservation(msg.reservation);
        break;

      case "room.status.changed":
        setRooms((rs) => rs.map((r) => (r.id === msg.room.id ? msg.room : r)));
        break;

      case "availability.changed":
        // Bandlikni Shaxmatka bronlardan o'zi hisoblaydi. Bu event
        // xona yopilganda yoki ochilganda ham keladi (ta'mir, Beds24
        // `black`) — yopiq kunlarni qayta o'qiymiz.
        scheduleBlocksReload();
        break;

      default:
        // sync.failed, webhook.needs_attention, rate.sync.updated —
        // admin panel (Channel manager) event'lari, Shaxmatka ko'rsatmaydi.
        // Bron holati (✓ / ⚠) `reservation.updated` bilan keladi
        break;
    }
  }, [reload, applyReservation, scheduleBlocksReload]);

  useEffect(() => {
    const client = createRealtimeClient({
      onEvent: handleRealtime,
      onStatus: setWsStatus,
    });
    return () => client.close();
  }, [handleRealtime]);

  /* ------------------------------ narxlar (TZ 7-band, Q8) ------------------------------ */
  /**
   * Yangi bron uchun taklif narxi.
   *
   * `RatePlan` da bugungi kunga narx bo'lsa o'sha, bo'lmasa 0 —
   * admin qo'lda kiritadi. Avtomatik hisoblash YO'Q (Q8).
   */
  const priceForType = useCallback(
    (type) => typePrices[type] ?? 0,
    [typePrices]
  );

  /* ------------------------------ availability check ------------------------------ */
  // Backend `isRoomFree` bilan bir xil: band bron yoki yopiq kun.
  // Chiqish kuni tekshirilmaydi — `[checkIn, checkOut)`.
  const isRoomAvailable = useCallback((roomId, checkIn, checkOut, excludeId) => {
    const ci = fromKey(checkIn), co = fromKey(checkOut);
    const busy = reservations.some((r) => {
      if (r.id === excludeId) return false;
      if (r.roomId !== roomId) return false;
      if (!holdsRoom(r)) return false;
      const rci = fromKey(r.checkIn), rco = fromKey(r.checkOut);
      return ci < rco && co > rci;
    });
    if (busy) return false;
    for (let d = ci; d < co; d = addDays(d, 1)) {
      if (blocks.has(blockKey(roomId, toKey(d)))) return false;
    }
    return true;
  }, [reservations, blocks]);

  const availableRoomsFor = useCallback((checkIn, checkOut, excludeId, roomType) => {
    return rooms.filter((rm) => (!roomType || rm.type === roomType || true) && isRoomAvailable(rm.id, checkIn, checkOut, excludeId));
  }, [rooms, isRoomAvailable]);

  /* ------------------------------ filtering ------------------------------ */
  const visibleRooms = useMemo(() => rooms.filter((r) => {
    if (filters.floor !== "all" && String(r.floor) !== filters.floor) return false;
    if (filters.type !== "all" && r.type !== filters.type) return false;
    if (filters.status !== "all" && r.status !== filters.status) return false;
    return true;
  }), [rooms, filters]);

  const searchLower = search.trim().toLowerCase();
  const matchesSearch = (r) => {
    if (!searchLower) return false;
    return (
      r.guestName.toLowerCase().includes(searchLower) ||
      (r.phone || "").toLowerCase().includes(searchLower) ||
      r.roomId.toLowerCase().includes(searchLower) ||
      r.id.toLowerCase().includes(searchLower)
    );
  };
  const matchesFilter = (r) => {
    if (filters.source !== "all" && r.source !== filters.source) return false;
    if (filters.resStatus !== "all" && r.status !== filters.resStatus) return false;
    return true;
  };

  /* ------------------------------ mutation helpers ------------------------------ */
  /**
   * Xona holatini qo'lda o'zgartirish (quick menu orqali).
   * Optimistik yangilanish — server xato bersa orqaga qaytariladi.
   */
  async function updateRoom(roomId, patch) {
    if (!patch.status) return;
    const prev = rooms.find((r) => r.id === roomId);
    setRooms((rs) => rs.map((r) => (r.id === roomId ? { ...r, ...patch } : r)));
    try {
      await api.setRoomStatus(roomId, patch.status);
    } catch (e) {
      if (prev) setRooms((rs) => rs.map((r) => (r.id === roomId ? prev : r)));
      handleApiError(e);
    }
  }

  /* ------ mutatsiyalar: hammasi backend orqali ------
     Har biri API'ni chaqiradi, javobdagi yangi holatni state'ga
     yozadi. Server availability va xona holatini o'zi hisoblaydi.
     Xato bo'lsa — conflictMsg orqali ko'rsatiladi (TZ 17-band).
  */

  async function createReservation(data) {
    const safePrice = Number.isFinite(Number(data.price)) ? Number(data.price) : 0;
    try {
      const created = await api.createReservation({
        roomId: data.roomId,
        guestName: data.guestName,
        phone: data.phone || undefined,
        checkIn: data.checkIn,
        checkOut: data.checkOut,
        adults: data.adults,
        children: data.children,
        source: data.source,
        pricePerNight: safePrice,
        priceReason: data.priceReason || undefined,
        notes: data.notes || undefined,
        withMeal: !!data.withMeal,
        initialPayment: data.paid > 0 ? Number(data.paid) : undefined,
        paymentMethod: "Naqd",
      });
      applyReservation(created);
      await refreshRooms();
      setCreateDraft(null);
    } catch (e) {
      handleApiError(e);
    }
  }

  async function checkIn(res) {
    try {
      applyReservation(await api.checkIn(res.id));
      await refreshRooms();
    } catch (e) { handleApiError(e); }
  }

  async function checkOutRes(res) {
    try {
      applyReservation(await api.checkOut(res.id));
      await refreshRooms();
      setSubPanel(null);
    } catch (e) { handleApiError(e); }
  }

  /**
   * Bekor qilish — jarima bo'lsa avval ogohlantiradi (S11).
   *
   * NEGA SO'RAYMIZ: kech bekor qilishda 1 kecha narxi olinadi.
   * Bu pul, shuning uchun xodim tasdiqlashi kerak — jarima
   * kutilmaganda paydo bo'lmasin.
   */
  async function cancelRes(res) {
    try {
      const preview = await api.cancelPreview(res.id);

      if (!preview.isFree) {
        setCancelPrompt({ res, fee: preview.fee, hours: preview.freeUntilHours });
        return;
      }

      await doCancel(res);
    } catch (e) { handleApiError(e); }
  }

  async function doCancel(res) {
    try {
      applyReservation(await api.cancel(res.id));
      await refreshRooms();
      setDetailId(null);
      setCancelPrompt(null);
    } catch (e) { handleApiError(e); }
  }

  async function addPayment(res, amount, method, note, currency) {
    try {
      applyReservation(await api.addPayment(res.id, Number(amount), method, note || undefined, currency));
    } catch (e) { handleApiError(e); }
  }

  /** Beds24'ga yetmagan bron — qayta yuborish (natija bron holatida ko'rinadi) */
  async function resyncRes(res) {
    const r = await api.resyncReservation(res.id);
    if (r && r.reservation) applyReservation(r.reservation);
  }

  /** Beds24'dan qayta olish — natija matni (o'tkazildi / qo'lda hal qilish) qaytadi */
  async function refreshRes(res) {
    const r = await api.refreshFromChannel(res.id);
    if (r && r.reservation) applyReservation(r.reservation);
    return r && r.result;
  }

  async function reversePayment(res, payment) {
    try {
      applyReservation(await api.reversePayment(res.id, payment.id));
    } catch (e) { handleApiError(e); }
  }

  async function addCharge(res, label, amount) {
    try {
      applyReservation(await api.addCharge(res.id, label, Number(amount)));
    } catch (e) { handleApiError(e); }
  }

  async function changeRoom(res, newRoomId) {
    try {
      applyReservation(await api.changeRoom(res.id, newRoomId));
      await refreshRooms();
      setSubPanel(null);
    } catch (e) { handleApiError(e); }
  }

  async function changeDates(res, checkIn, checkOut) {
    if (fromKey(checkOut) <= fromKey(checkIn)) {
      setConflictMsg("Chiqish sanasi kirish sanasidan keyin bo'lishi kerak.");
      return;
    }
    try {
      applyReservation(await api.changeDates(res.id, checkIn, checkOut));
      await refreshRooms();
      setSubPanel(null);
    } catch (e) { handleApiError(e); }
  }

  /* ------------------------------ sichqoncha bilan surish YO'Q ------------------------------
     2026-09-25 da olib tashlandi (ISH_REJASI.md S1).

     Ilgari bron blokini surib sana va xonani o'zgartirish mumkin
     edi. Bosish paytida sichqoncha 1 piksel qimirlasa ham bron
     ko'chib, o'zgarish Beds24'ga ketardi — qabulxona buni
     sezmasdi ham. Endi sana faqat tafsilot oynasidagi
     "Sanalarni o'zgartirish", xona esa "Xonani almashtirish"
     tugmasi orqali o'zgaradi. Qayta qo'shilmasin.
  */

  /* ------------------------------ navigation ------------------------------ */
  const goToday = () => setViewStart(addDays(today, -1));
  const goPrev = () => setViewStart((v) => addDays(v, -1));
  const goNext = () => setViewStart((v) => addDays(v, 1));

  const detailRes = reservations.find((r) => r.id === detailId) || null;

  /* ============================== RENDER ============================== */

  // Backend ma'lumoti yuklanmaguncha
  if (loading) {
    return (
      <div className="h-screen w-full flex items-center justify-center bg-gray-50">
        <div className="text-sm text-gray-500">Yuklanmoqda...</div>
      </div>
    );
  }

  if (needsLogin) {
    return (
      <LoginScreen
        onSuccess={() => {
          setNeedsLogin(false);
          setLoading(true);
          reload();
        }}
      />
    );
  }

  if (loadError) {
    return (
      <div className="h-screen w-full flex items-center justify-center bg-gray-50">
        <div className="max-w-sm text-center space-y-3">
          <div className="text-sm font-semibold text-red-700">Ma'lumotni yuklab bo'lmadi</div>
          <div className="text-xs text-gray-600">{loadError}</div>
          <div className="text-xs text-gray-400">Backend ishlab turganini tekshiring: {API_BASE || location.origin}</div>
          <Btn variant="primary" onClick={() => { setLoading(true); reload(); }}>Qayta urinish</Btn>
        </div>
      </div>
    );
  }

  return (
    <div className="h-screen w-full flex flex-col bg-gray-50 text-gray-900 font-sans select-none" style={{ fontFeatureSettings: '"tnum"' }}>
      <Toolbar
        viewStart={viewStart} today={today} rangeLen={rangeLen} zoomIdx={zoomIdx}
        onToday={goToday} onPrev={goPrev} onNext={goNext}
        onSetRange={setRangeLen} onSetViewStart={setViewStart}
        onZoomIn={() => setZoomIdx((i) => clamp(i + 1, 0, ZOOM_LEVELS.length - 1))}
        onZoomOut={() => setZoomIdx((i) => clamp(i - 1, 0, ZOOM_LEVELS.length - 1))}
        search={search} onSearch={setSearch}
        filtersOpen={filtersOpen} setFiltersOpen={setFiltersOpen} filters={filters} setFilters={setFilters}
        pricingOpen={pricingOpen} setPricingOpen={setPricingOpen}
        wsStatus={wsStatus}
        onAddReservation={() => {
          if (rooms.length === 0) return;
          openCreate({ roomId: rooms[0].id, checkIn: toKey(today), checkOut: toKey(addDays(today, 1)) });
        }}
      />

      <div className="flex-1 overflow-auto" ref={gridRef}>
        <div style={{ width: LEFT_WIDTH + days.length * cellWidth }}>
          {/* header row */}
          <div className="flex sticky top-0 z-30">
            <div className="sx-hleft sticky left-0 z-40 bg-gray-100 flex items-center px-3 text-xs font-semibold text-gray-500 uppercase tracking-wide" style={{ width: LEFT_WIDTH, height: HEADER_HEIGHT, minWidth: LEFT_WIDTH }}>
              Xona
            </div>
            {days.map((d) => {
              const isToday = isSameDay(d, today);
              const isWeekend = [0, 6].includes(d.getDay());
              return (
                <div key={toKey(d)}
                  className={`sx-hcell flex flex-col items-center justify-center text-xs ${isToday ? "bg-blue-600 text-white" : isWeekend ? "bg-gray-100 text-gray-500" : "bg-gray-50 text-gray-500"}`}
                  style={{ width: cellWidth, height: HEADER_HEIGHT, minWidth: cellWidth }}>
                  <span className="font-semibold leading-tight">{fmtShort(d)}</span>
                  <span className="leading-tight opacity-80">{fmtWeekday(d)}</span>
                </div>
              );
            })}
          </div>

          {/* room rows */}
          {visibleRooms.map((room) => {
            // Bekor qilingan va kelmagan bronlar odatda gridda ko'rinmaydi —
            // xona bo'sh deb hisoblanadi (backend ham shunday). Lekin filtr
            // aynan shu holatga qo'yilsa ularni ko'rsatamiz: aks holda filtr
            // hech nima topmaydi va tarixni ko'rish imkonsiz bo'ladi
            // (TZ 2-band: tarix saqlanadi).
            const roomReservations = reservations.filter(
              (r) => r.roomId === room.id && (holdsRoom(r) || filters.resStatus === r.status)
            );
            return (
              <div key={room.id} className="flex relative" style={{ height: ROW_HEIGHT }}>
                <div
                  className="sx-room sticky left-0 z-20 bg-white flex flex-col justify-center px-3 cursor-pointer hover:bg-gray-50"
                  style={{ width: LEFT_WIDTH, minWidth: LEFT_WIDTH }}
                  onClick={(e) => setRoomMenu({ roomId: room.id, x: e.clientX, y: e.clientY })}
                >
                  <div className="flex items-center gap-2">
                    <span className="font-semibold text-sm text-gray-900">{room.number}</span>
                    <span className="text-xs text-gray-400">{typeLabel(room.type)}</span>
                  </div>
                  <div className="mt-1"><StatusBadge status={room.status} /></div>
                </div>

                <div className="relative" style={{ width: days.length * cellWidth, height: ROW_HEIGHT }}>
                  {days.map((d, i) => {
                    const key = toKey(d);
                    const reason = blocks.get(blockKey(room.id, key));
                    if (reason) {
                      // Yopiq kun: bron ochilmaydi, sababi ko'rsatiladi
                      const label = reason.startsWith("Beds24") ? "Beds24" : "Yopiq";
                      return (
                        <div
                          key={i}
                          title={`Yopiq: ${reason}`}
                          onClick={() => setConflictMsg(`Xona ${room.number}, ${fmtShort(d)} — yopiq (${reason}). Bu kunga bron qilib bo'lmaydi.`)}
                          className="sx-cell sx-blocked absolute top-0 flex items-center justify-center cursor-not-allowed"
                          style={{ left: i * cellWidth, width: cellWidth, height: ROW_HEIGHT }}
                        >
                          {cellWidth >= 64 && <span className="sx-blocked-label">{label}</span>}
                        </div>
                      );
                    }
                    return (
                      <div
                        key={i}
                        onClick={() => openCreate({ roomId: room.id, checkIn: key, checkOut: toKey(addDays(d, 1)) })}
                        className={`sx-cell absolute top-0 hover:bg-blue-50 cursor-cell ${isSameDay(d, today) ? "bg-blue-50" : ""}`}
                        style={{ left: i * cellWidth, width: cellWidth, height: ROW_HEIGHT }}
                      />
                    );
                  })}

                  {roomReservations.map((res) => {
                    const ci = fromKey(res.checkIn), co = fromKey(res.checkOut);
                    const startOffset = diffDays(ci, viewStart);
                    const nights = nightsBetween(ci, co);
                    const left = startOffset * cellWidth;
                    const width = nights * cellWidth;
                    if (startOffset + nights <= 0 || startOffset >= days.length) return null;

                    const dimmed = (searchLower && !matchesSearch(res)) || !matchesFilter(res);
                    const highlighted = searchLower && matchesSearch(res);

                    return (
                      <ReservationBlock
                        key={res.id}
                        res={res} left={left} width={width}
                        dimmed={dimmed} highlighted={highlighted}
                        onOpen={() => setDetailId(res.id)}
                      />
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Room quick menu */}
      {roomMenu && (
        <RoomQuickMenu
          room={rooms.find((r) => r.id === roomMenu.roomId)}
          x={roomMenu.x} y={roomMenu.y}
          reservations={reservations}
          today={today}
          priceForType={priceForType}
          onClose={() => setRoomMenu(null)}
          onNewReservation={(roomId) => { setRoomMenu(null); openCreate({ roomId, checkIn: toKey(today), checkOut: toKey(addDays(today, 1)) }); }}
          onViewReservation={(id) => { setRoomMenu(null); setDetailId(id); }}
          onChangeStatus={(roomId, status) => { updateRoom(roomId, { status }); setRoomMenu(null); }}
          onMaintenanceBlock={(roomId) => { updateRoom(roomId, { status: "out_of_order" }); setRoomMenu(null); }}
        />
      )}

      {/* Bekor qilish jarimasi ogohlantirishi */}
      {cancelPrompt && (
        <Modal
          title="Bekor qilishda jarima"
          subtitle={`Xona ${cancelPrompt.res.roomId} · ${cancelPrompt.res.guestName}`}
          onClose={() => setCancelPrompt(null)}
          width={420}
          footer={<>
            <Btn onClick={() => setCancelPrompt(null)}>Orqaga</Btn>
            <Btn variant="danger" onClick={() => doCancel(cancelPrompt.res)}>
              Jarima bilan bekor qilish
            </Btn>
          </>}>
          <div className="space-y-3 text-sm">
            <div className="p-3 rounded-lg bg-red-50 border border-red-200">
              <div className="text-gray-700">Olinadigan jarima</div>
              <div className="text-xl font-semibold text-red-700 mt-1">
                {money(cancelPrompt.fee, cancelPrompt.res.currency)}
              </div>
            </div>
            <div className="text-gray-600">
              Kirish sanasiga {cancelPrompt.hours} soatdan kam qoldi.
              Shu sababli 1 kecha narxi jarima sifatida olinadi.
            </div>
            <div className="text-gray-500 text-xs">
              Jarima daromad sifatida yoziladi va hisobotda ko'rinadi.
            </div>
          </div>
        </Modal>
      )}

      {/* Create reservation modal */}
      {createDraft && (
        <CreateReservationModal
          draft={createDraft} rooms={rooms} today={today} priceForType={priceForType}
          isRoomAvailable={isRoomAvailable}
          onClose={() => setCreateDraft(null)}
          onCreate={createReservation}
        />
      )}

      {/* Detail modal */}
      {detailRes && !subPanel && (
        <DetailModal
          res={detailRes} rooms={rooms} today={today}
          onClose={() => setDetailId(null)}
          onCheckIn={() => checkIn(detailRes)}
          onOpenCheckout={() => setSubPanel("checkout")}
          onOpenPayment={() => setSubPanel("payment")}
          onOpenCharge={() => setSubPanel("charge")}
          onOpenChangeRoom={() => setSubPanel("changeRoom")}
          onOpenChangeDates={() => setSubPanel("changeDates")}
          onCancel={() => cancelRes(detailRes)}
          onReversePayment={(p) => reversePayment(detailRes, p)}
          onResync={() => resyncRes(detailRes)}
          onRefresh={() => refreshRes(detailRes)}
        />
      )}

      {detailRes && subPanel === "payment" && (
        <PaymentModal res={detailRes} onClose={() => setSubPanel(null)}
          onAdd={(amt, method, note, currency) => { addPayment(detailRes, amt, method, note, currency); setSubPanel(null); }} />
      )}
      {detailRes && subPanel === "charge" && (
        <ChargeModal res={detailRes} onClose={() => setSubPanel(null)}
          onAdd={(label, amt) => { addCharge(detailRes, label, amt); setSubPanel(null); }} />
      )}
      {detailRes && subPanel === "changeRoom" && (
        <ChangeRoomModal res={detailRes} rooms={rooms} availableRoomsFor={availableRoomsFor}
          onClose={() => setSubPanel(null)} onConfirm={(roomId) => changeRoom(detailRes, roomId)} />
      )}
      {detailRes && subPanel === "changeDates" && (
        <ChangeDatesModal res={detailRes} onClose={() => setSubPanel(null)}
          onConfirm={(ci, co) => changeDates(detailRes, ci, co)} />
      )}
      {detailRes && subPanel === "checkout" && (
        <CheckoutModal res={detailRes} onClose={() => setSubPanel(null)} onConfirm={() => checkOutRes(detailRes)} />
      )}

      {conflictMsg && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-red-600 text-white px-4 py-3 rounded-lg shadow-xl flex items-center gap-2 text-sm font-medium" style={{ zIndex: 200 }}>
          <AlertTriangle size={16} /> {conflictMsg}
          <button onClick={() => setConflictMsg(null)} className="ml-2 text-white/80 hover:text-white"><X size={14} /></button>
        </div>
      )}
    </div>
  );
}

/* ============================== TOOLBAR ============================== */

function Toolbar(props) {
  const {
    viewStart, today, rangeLen, onToday, onPrev, onNext, onSetRange, onSetViewStart,
    onZoomIn, onZoomOut, search, onSearch, filtersOpen, setFiltersOpen, filters, setFilters,
    pricingOpen, setPricingOpen, onAddReservation,
    wsStatus,
  } = props;

  return (
    <div className="border-b border-gray-200 bg-white z-40 relative">
      <div className="flex items-center gap-2 px-3 py-2 flex-wrap">
        <div className="flex items-center gap-1 mr-2">
          <div className="h-7 w-7 rounded-md bg-blue-600 flex items-center justify-center text-white font-bold text-xs">SH</div>
          <span className="font-semibold text-sm text-gray-800 mr-1">Shaxmatka</span>
          {/* Real-time ulanish holati (TZ 4-band).
              Yashil = event'lar keladi, sariq = uzilgan, qayta
              ulanmoqda. Uzilganda ma'lumot eskiradi — foydalanuvchi
              buni bilishi kerak. */}
          <span
            title={wsStatus === "online"
              ? "Real-time ulangan — o'zgarishlar darhol ko'rinadi"
              : "Real-time uzilgan — qayta ulanmoqda. Ma'lumot eskirgan bo'lishi mumkin."}
            className={`h-2 w-2 rounded-full mr-1 ${wsStatus === "online" ? "bg-green-500" : "bg-amber-400 animate-pulse"}`}
          />
        </div>

        <div className="flex items-center rounded-md border border-gray-300 overflow-hidden">
          <button onClick={onPrev} className="p-1.5 hover:bg-gray-50 text-gray-600 border-r border-gray-300"><ChevronLeft size={16} /></button>
          <button onClick={onToday} className="px-2.5 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-50 border-r border-gray-300">Bugun</button>
          <button onClick={onNext} className="p-1.5 hover:bg-gray-50 text-gray-600"><ChevronRight size={16} /></button>
        </div>

        <input
          type="date" value={toKey(addDays(viewStart, 1))}
          onChange={(e) => onSetViewStart(addDays(fromKey(e.target.value), -1))}
          className="rounded-md border border-gray-300 px-2 py-1.5 text-sm text-gray-700"
        />

        <div className="flex items-center rounded-md border border-gray-300 overflow-hidden text-sm">
          {[7, 14, 30].map((n) => (
            <button key={n} onClick={() => onSetRange(n)}
              className={`px-2.5 py-1.5 font-medium ${rangeLen === n ? "bg-blue-600 text-white" : "text-gray-600 hover:bg-gray-50"} ${n !== 30 ? "border-r border-gray-300" : ""}`}>
              {n}d
            </button>
          ))}
        </div>

        <div className="relative flex-1 min-w-40 max-w-60">
          <Search size={14} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400" />
          <input
            value={search} onChange={(e) => onSearch(e.target.value)}
            placeholder="Mehmon, xona, telefon…"
            className="w-full rounded-md border border-gray-300 pl-8 pr-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div className="relative">
          <Btn variant={filtersOpen ? "primary" : "default"} onClick={() => { setFiltersOpen((o) => !o); setPricingOpen(false); }}>
            <SlidersHorizontal size={14} /> Filtr
          </Btn>
          {filtersOpen && <FilterPanel filters={filters} setFilters={setFilters} onClose={() => setFiltersOpen(false)} />}
        </div>

        <div className="flex items-center rounded-md border border-gray-300 overflow-hidden">
          <button onClick={onZoomOut} className="p-1.5 hover:bg-gray-50 text-gray-600 border-r border-gray-300"><ZoomOut size={15} /></button>
          <button onClick={onZoomIn} className="p-1.5 hover:bg-gray-50 text-gray-600"><ZoomIn size={15} /></button>
        </div>

        <div className="relative">
          <Btn variant={pricingOpen ? "primary" : "default"} onClick={() => { setPricingOpen((o) => !o); setFiltersOpen(false); }}>
            <TrendingUp size={14} /> Narxlar<ChevronDown size={12} />
          </Btn>
          {pricingOpen && (
            <PricingPanel onClose={() => setPricingOpen(false)} />
          )}
        </div>

        <div className="ml-auto">
          <Btn variant="primary" onClick={onAddReservation}><Plus size={15} /> Bron qo'shish</Btn>
        </div>
      </div>
    </div>
  );
}

function FilterPanel({ filters, setFilters, onClose }) {
  const set = (k, v) => setFilters((f) => ({ ...f, [k]: v }));
  return (
    <div className="absolute right-0 top-full mt-1 w-64 bg-white border border-gray-200 rounded-lg shadow-xl p-3 z-50 space-y-3" onMouseLeave={onClose}>
      <Field label="Qavat">
        <SelectInput value={filters.floor} onChange={(e) => set("floor", e.target.value)}>
          <option value="all">Barcha qavatlar</option><option value="1">1-qavat</option><option value="2">2-qavat</option>
        </SelectInput>
      </Field>
      <Field label="Xona turi">
        <SelectInput value={filters.type} onChange={(e) => set("type", e.target.value)}>
          <option value="all">Barcha turlar</option>
          {Object.entries(ROOM_TYPES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
        </SelectInput>
      </Field>
      <Field label="Xona holati">
        <SelectInput value={filters.status} onChange={(e) => set("status", e.target.value)}>
          <option value="all">Barcha holatlar</option>
          {Object.entries(ROOM_STATUS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
        </SelectInput>
      </Field>
      <Field label="Bron manbasi">
        <SelectInput value={filters.source} onChange={(e) => set("source", e.target.value)}>
          <option value="all">Barcha manbalar</option>
          {Object.entries(SOURCES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
        </SelectInput>
      </Field>
      <Field label="Bron holati">
        <SelectInput value={filters.resStatus} onChange={(e) => set("resStatus", e.target.value)}>
          <option value="all">Barchasi</option>
          {Object.entries(RES_STATUS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
        </SelectInput>
      </Field>
      <Btn className="w-full justify-center" onClick={() => setFilters({ floor: "all", type: "all", status: "all", source: "all", resStatus: "all" })}>Tozalash</Btn>
    </div>
  );
}

/* ==========================================================================
   NARXLAR PANELI — TZ 7-band, mijoz qarori Q8


   Q8: avtomatik o'suvchi narx mexanizmi OLIB TASHLANDI. Eski
   formula `base + confirmedCount * increment` edi; `confirmedCount`
   faqat o'sardi, shuning uchun narx `max` ga tegib qotib qolardi va
   Booking.com'da sotilmaydigan darajaga chiqardi. TZ'da bunday
   mexanizm yo'q.

   Endi: admin narxni QO'LDA belgilaydi (so'm). Yangi narx darhol
   sayt, Shaxmatka va yangi bronlarda; mavjud bronlar summasi o'zgarmaydi.
   Beds24 ulangan bo'lsa narx OTA'ga $ bo'lib ketadi (bugungi kurs) va
   har tarif yonida holati ko'rinadi:
     ● yuborildi   ○ yuborilmagan   ⚠ xato [↻]
========================================================================== */

function RateSyncDot({ status }) {
  const m = {
    synced:  { cls: "bg-emerald-500", title: "Beds24 qabul qildi" },
    pending: { cls: "bg-gray-300",    title: "Beds24'ga hali yuborilmagan" },
    error:   { cls: "bg-red-500",     title: "Yuborilmadi — qayta urinib ko'ring" },
  }[status] || { cls: "bg-gray-200", title: "Narx belgilanmagan" };

  return <span className={`inline-block h-2 w-2 rounded-full flex-shrink-0 ${m.cls}`} title={m.title} />;
}

function PricingPanel({ onClose }) {
  const today = useMemo(() => startOfDay(new Date()), []);
  const [from, setFrom] = useState(toKey(today));
  const [to, setTo] = useState(toKey(addDays(today, 6)));

  const [rates, setRates] = useState(null);      // null = yuklanmoqda
  const [draft, setDraft] = useState({});         // {roomTypeId: "35"}
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  const [error, setError] = useState(null);
  // Beds24 ulangan bo'lsa — narx yonida yuborilish holati va $
  const ch = useChannel();

  /**
   * Oraliqdagi narxlarni o'qiydi.
   *
   * Bir oraliqda turli kunlar turli narxda bo'lishi mumkin. Panel
   * bitta qiymat ko'rsatadi, shuning uchun: hammasi bir xil bo'lsa
   * o'sha narx, aks holda bo'sh (admin yangi narx kiritadi).
   */
  const load = useCallback(async () => {
    setRates(null);
    setError(null);
    try {
      const rows = await api.ratePlans(from, to);
      const byType = {};
      for (const r of rows) {
        (byType[r.roomTypeId] = byType[r.roomTypeId] || []).push(r);
      }

      const summary = {};
      for (const key of Object.keys(ROOM_TYPES)) {
        const list = byType[key] || [];
        const prices = [...new Set(list.map((r) => r.price))];
        const statuses = new Set(list.map((r) => r.syncStatus));
        summary[key] = {
          price: prices.length === 1 ? prices[0] : null,
          mixed: prices.length > 1,
          days: list.length,
          // Eng "yomon" holat ko'rsatiladi: xato > yuborilmagan > yuborildi
          status: list.length === 0 ? null
            : statuses.has("error") ? "error"
            : statuses.has("pending") ? "pending"
            : "synced",
        };
      }
      setRates(summary);
      setDraft({});
    } catch (e) {
      setError(e.message);
      setRates({});
    }
  }, [from, to]);

  useEffect(() => { load(); }, [load]);


  const save = async () => {
    const prices = {};
    for (const [key, v] of Object.entries(draft)) {
      const n = Number(v);
      // 0 — "sotilmaydi" degani: backend rad etadi, bo'sh maydon kabi o'tkaziladi
      if (v !== "" && Number.isFinite(n) && n > 0) prices[key] = n;
    }
    if (Object.keys(prices).length === 0) return;

    setSaving(true);
    setError(null);
    try {
      // DB'ga darhol yoziladi, Beds24'ga fonda ketadi —
      // admin kutmaydi
      await api.setRates(from, to, prices);
      setSaved(true);
      setTimeout(() => setSaved(false), 2000);
      await load();
    } catch (e) {
      setError(e.message);
    } finally {
      setSaving(false);
    }
  };

  const resync = async (roomTypeId) => {
    try {
      await api.resyncRates([roomTypeId], from, to);
      await load();
    } catch (e) {
      setError(e.message);
    }
  };

  return (
    <div className="absolute right-0 top-full mt-1 w-80 bg-white border border-gray-200 rounded-lg shadow-xl p-3.5 z-50 space-y-3">
      <div className="flex items-center justify-between">
        <span className="text-sm font-semibold text-gray-800">Narxlar</span>
        <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><X size={16} /></button>
      </div>

      <div className="grid grid-cols-2 gap-2">
        <Field label="Dan">
          <TextInput type="date" value={from} onChange={(e) => setFrom(e.target.value)} />
        </Field>
        <Field label="Gacha">
          <TextInput type="date" value={to} onChange={(e) => setTo(e.target.value)} />
        </Field>
      </div>

      <div className="space-y-2">
        {rates === null ? (
          // Loading — skeleton
          Object.keys(ROOM_TYPES).map((k) => (
            <div key={k} className="h-8 rounded bg-gray-100 animate-pulse" />
          ))
        ) : (
          Object.entries(ROOM_TYPES).map(([key, type]) => {
            const r = rates[key] || {};
            // Beds24'ga bog'langan tarif — yuborilish holati va $ narxi
            const linked = ch.connected && ch.mappedTypes.has(key);
            return (
              <div key={key}>
                <div className="flex items-center gap-2">
                  <span className="text-xs text-gray-600 w-24 flex-shrink-0">{type.label}</span>
                  <TextInput
                    type="number" min={0} step="1000"
                    placeholder={r.mixed ? "har xil" : r.price != null ? String(r.price) : "—"}
                    value={draft[key] ?? ""}
                    onChange={(e) => setDraft((d) => ({ ...d, [key]: e.target.value }))}
                  />
                  {linked && (
                    <div className="flex items-center gap-1 w-8 flex-shrink-0">
                      <RateSyncDot status={r.status} />
                      {r.status === "error" && (
                        <button onClick={() => resync(key)} title="Qayta yuborish"
                          className="text-gray-400 hover:text-blue-600"><RotateCcw size={12} /></button>
                      )}
                    </div>
                  )}
                </div>
                {linked && ch.rate && r.price != null && (
                  <div className="text-xs text-gray-400 pl-24 ml-2">≈ {money(r.price / ch.rate, "USD")} Beds24'da</div>
                )}
              </div>
            );
          })
        )}
      </div>

      {error && (
        <div className="rounded-md bg-red-50 border border-red-200 px-2 py-1.5 text-xs text-red-700">
          {error}
        </div>
      )}

      <p className="text-xs text-gray-500">
        Narx so'mda. Yangi narx sayt va yangi bronlarda darhol; mavjud bronlar summasi o'zgarmaydi.
        {ch.connected && <> O'zgarish Beds24 orqali OTA'larga yuboriladi{ch.rate ? ` (1 $ = ${fmtRate(ch.rate)} so'm)` : ""}.</>}
      </p>

      <div className="flex items-center justify-end gap-2">
        {saved && <span className="text-xs text-emerald-600 mr-auto">✓ Saqlandi</span>}
        <Btn onClick={onClose}>Yopish</Btn>
        <Btn variant="primary" onClick={save} disabled={saving || Object.keys(draft).length === 0}>
          {saving ? "Saqlanmoqda…" : "Saqlash"}
        </Btn>
      </div>
    </div>
  );
}

  return (
    <div className="flex items-center gap-0.5 flex-shrink-0" title={`${count} mehmon`}>
      {Array.from({ length: count }).map((_, i) => (
        <span key={i} className="block w-1.5 h-1.5 rounded-full bg-emerald-400 ring-1 ring-white/60" />
      ))}

}

/**
 * Bron bloki — faqat bosiladi, surilmaydi (ISH_REJASI.md S1).
 * Bosilganda tafsilot oynasi ochiladi.
 */
function ReservationBlock({ res, left, width, dimmed, highlighted, onOpen }) {
  // Noma'lum manba (yangi OTA) oynani yiqitmasin
  const src = SOURCES[res.source] || SOURCES.other;
  /* Backend hisoblagan summa: nonushta va bekor qilish jarimasi
     ham kiradi — resMoney() */
  const { remaining } = resMoney(res);
  const isPast = res.status === "checked_out";
  const isCancelled = res.status === "cancelled";

  return (
    <div
      onClick={onOpen}
      className={`absolute top-1 bottom-1 rounded-md shadow-sm ${src.bar} ${src.text} px-2 py-1 flex flex-col justify-between overflow-hidden cursor-pointer z-10
        ${dimmed ? "opacity-25" : "opacity-100"} ${highlighted ? "ring-2 ring-yellow-400" : ""}
        ${isPast ? "opacity-60" : ""} ${isCancelled ? "opacity-30 line-through" : ""}`}
      style={{ left, width: Math.max(width - 4, 20), marginLeft: 2 }}
      title={`${res.guestName} • ${src.label}`}
    >
      <div className="flex-1 min-w-0">
        <div className="flex items-center justify-between gap-1">
          <span className="text-xs font-semibold truncate">{res.guestName}</span>
          <div className="flex items-center gap-1 flex-shrink-0">
            {res.withMeal && <ChefHat size={12} />}
            <GuestDots count={res.adults + (res.children || 0)} />
          </div>
        </div>
        <div className="text-xs opacity-90 truncate">{src.label} · {res.adults + (res.children || 0)} mehmon</div>
      </div>
      <div className="flex items-center gap-1">
        {remaining > 0 ? (
          <span className="text-xs font-mono font-bold">{money(remaining, res.currency)}</span>
        ) : (
          <Check size={13} strokeWidth={3} />
        )}
        {/* Beds24'ga yetmagan (rad etilgan / xato) — tafsilotda sabab va "Qayta yuborish" */}
        {(res.syncStatus === "rejected" || res.syncStatus === "failed") && (
          <span title={res.syncError || "Beds24'ga yuborilmadi"} className="ml-auto"><AlertTriangle size={12} strokeWidth={2.5} /></span>
        )}
      </div>
    </div>
  );
}

/* ============================== ROOM QUICK MENU ============================== */

function RoomQuickMenu({ room, x, y, reservations, today, priceForType, onClose, onNewReservation, onViewReservation, onChangeStatus, onMaintenanceBlock }) {
  if (!room) return null;
  const current = reservations.find((r) => r.roomId === room.id && holdsRoom(r) && r.status !== "checked_out" &&
    fromKey(r.checkIn) <= today && fromKey(r.checkOut) > today);
  const next = reservations
    .filter((r) => r.roomId === room.id && holdsRoom(r) && fromKey(r.checkIn) > today)
    .sort((a, b) => fromKey(a.checkIn) - fromKey(b.checkIn))[0];

  const MARGIN = 8;
  const menuWidth = Math.min(256, window.innerWidth - MARGIN * 2);
  const maxLeft = Math.max(MARGIN, window.innerWidth - menuWidth - MARGIN);
  const maxTop = Math.max(MARGIN, window.innerHeight - MARGIN);
  const left = clamp(x, MARGIN, maxLeft);
  const top = Math.min(y, maxTop - MARGIN);
  const style = { left, top, width: menuWidth, maxHeight: `calc(100vh - ${top + MARGIN}px)` };

  return (
    <div className="fixed inset-0" style={{ zIndex: 90 }} onClick={onClose}>
      <div className="absolute bg-white rounded-lg shadow-2xl border border-gray-200 p-3 space-y-2 text-sm overflow-y-auto" style={style} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between">
          <span className="font-semibold text-gray-900">Xona {room.number}</span>
          <StatusBadge status={room.status} />
        </div>
        <div className="text-xs text-gray-500">{typeLabel(room.type)} · Bugungi narx {money(priceForType(room.type))}</div>

        <div className="border-t border-gray-100 pt-2 space-y-1">
          <div className="text-xs font-medium text-gray-400 uppercase tracking-wide">Joriy mehmon</div>
          {current ? (
            <button className="w-full text-left text-xs text-blue-700 hover:underline" onClick={() => onViewReservation(current.id)}>
              {current.guestName} — {fmtShort(fromKey(current.checkOut))}gacha
            </button>
          ) : <div className="text-xs text-gray-400">Yo'q</div>}
        </div>

        <div className="space-y-1">
          <div className="text-xs font-medium text-gray-400 uppercase tracking-wide">Keyingi bron</div>
          {next ? (
            <button className="w-full text-left text-xs text-blue-700 hover:underline" onClick={() => onViewReservation(next.id)}>
              {next.guestName} — {fmtShort(fromKey(next.checkIn))}
            </button>
          ) : <div className="text-xs text-gray-400">Rejalashtirilmagan</div>}
        </div>

        <div className="border-t border-gray-100 pt-2 space-y-1.5">
          <Btn className="w-full justify-center" variant="primary" onClick={() => onNewReservation(room.id)}><Plus size={13} /> Yangi bron</Btn>
          <div className="grid grid-cols-2 gap-1.5">
            <SelectInput value={room.status} onChange={(e) => onChangeStatus(room.id, e.target.value)} className="text-xs">
              {Object.entries(ROOM_STATUS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
            </SelectInput>
            <Btn onClick={() => onMaintenanceBlock(room.id)} className="justify-center"><Wrench size={13} /> Bloklash</Btn>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================== CREATE RESERVATION MODAL ============================== */

function CreateReservationModal({ draft, rooms, today, priceForType, isRoomAvailable, onClose, onCreate }) {
  const room = rooms.find((r) => r.id === draft.roomId) || rooms[0];
  const [form, setForm] = useState({
    guestName: "", phone: "", checkIn: draft.checkIn, checkOut: draft.checkOut,
    adults: 2, children: 0, roomId: room.id, price: priceForType(room.type),
    source: "direct", paid: 0, notes: "", withMeal: false, priceReason: "",
  });
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const selectedRoom = rooms.find((r) => r.id === form.roomId);
  const nights = nightsBetween(fromKey(form.checkIn), fromKey(form.checkOut));
  const datesOk = form.checkIn && form.checkOut && fromKey(form.checkOut) > fromKey(form.checkIn);
  const available = form.roomId && datesOk
    ? isRoomAvailable(form.roomId, form.checkIn, form.checkOut) : true;

  /* Tarif — butun oraliq bo'yicha (backend lib/money.ts
     stayPriceFromRates bilan bir xil): har kecha o'z narxi,
     narxsiz kecha — belgilanganlar o'rtachasi. Ilgari faqat bugungi
     narx olinardi — juma/shanba narxi farq qilsa bron summasi va
     "chegirma" tekshiruvi backenddan boshqacha chiqardi. */
  const [stayTariff, setStayTariff] = useState(null);   // { total, perNight } | null
  const [priceTouched, setPriceTouched] = useState(false);
  useEffect(() => {
    if (!selectedRoom || !datesOk) { setStayTariff(null); return; }
    let alive = true;
    const lastNight = toKey(addDays(fromKey(form.checkOut), -1));
    api.ratePlans(form.checkIn, lastNight)
      .then((rows) => {
        if (!alive) return;
        const prices = (rows || []).filter((r) => r.roomTypeId === selectedRoom.type).map((r) => r.price);
        if (prices.length === 0) { setStayTariff(null); return; }
        const known = sumMoney(prices);
        const missing = Math.max(0, nights - prices.length);
        const total = missing > 0 ? round2(known + (known / prices.length) * missing) : known;
        // Kechalik narx 4 xona (sayt bilan bir xil): 350 / 3 = 116.6667,
        // x3 = $350.00 — tarif jamisiga aynan teng, sent ortiq olinmaydi
        const perNight = Math.round((total / nights) * 10000) / 10000;
        setStayTariff({ total, perNight });
        if (!priceTouched) setForm((f) => ({ ...f, price: perNight }));
      })
      .catch(() => { if (alive) setStayTariff(null); });
    return () => { alive = false; };
  }, [form.roomId, form.checkIn, form.checkOut]);   // eslint-disable-line

  /* Nonushta narxi — joriy sozlama (admin panel → Oshxona). Bron
     yaratilganda backend uni bronga ko'chiradi (S10). */
  const [mealPrice, setMealPrice] = useState(null);
  useEffect(() => {
    api.mealPrice().then((i) => setMealPrice(Number(i.price) || 0)).catch(() => setMealPrice(null));
  }, []);

  const guests = (Number(form.adults) || 0) + (Number(form.children) || 0);
  const roomTotal = round2(Number(form.price || 0) * nights);
  const mealTotal = form.withMeal && mealPrice ? round2(mealPrice * guests * nights) : 0;
  const total = sumMoney([roomTotal, mealTotal]);

  /* Chegirma: narx tarifdan past bo'lsa sabab talab qilinadi.
     Backend ham shu qoidani tekshiradi — jami
     summalar sentda solishtiriladi. Bu yerdagi tekshiruv faqat
     qulaylik uchun: xodim darhol ko'radi. */
  const tariffPrice = stayTariff ? stayTariff.perNight : (selectedRoom ? priceForType(selectedRoom.type) : 0);
  const isDiscounted = stayTariff
    ? toCents(roomTotal) < toCents(stayTariff.total)
    : tariffPrice > 0 && toCents(form.price) < toCents(tariffPrice);
  const reasonOk = !isDiscounted || form.priceReason.trim().length >= 3;

  const canSubmit = form.guestName.trim() && fromKey(form.checkOut) > fromKey(form.checkIn) && available && Number.isFinite(Number(form.price)) && Number(form.price) >= 0 && reasonOk;

  return (
    <Modal title="Bron yaratish" subtitle={`Xona ${selectedRoom?.number} · ${typeLabel(selectedRoom?.type)}`} onClose={onClose}
      footer={<>
        <Btn onClick={onClose}>Bekor qilish</Btn>
        <Btn variant="primary" disabled={!canSubmit} onClick={() => onCreate(form)}>Bron yaratish</Btn>
      </>}>
      <div className="space-y-3">
        <div className="grid grid-cols-2 gap-3">
          <Field label="Mehmon ismi"><TextInput value={form.guestName} onChange={(e) => set("guestName", e.target.value)} placeholder="To'liq ism" /></Field>
          <Field label="Telefon"><TextInput value={form.phone} onChange={(e) => set("phone", e.target.value)} placeholder="+998 ..." /></Field>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Kirish sanasi"><TextInput type="date" value={form.checkIn} onChange={(e) => set("checkIn", e.target.value)} /></Field>
          <Field label="Chiqish sanasi"><TextInput type="date" value={form.checkOut} onChange={(e) => set("checkOut", e.target.value)} /></Field>
        </div>
        <div className="grid grid-cols-3 gap-3">
          <Field label="Kattalar"><TextInput type="number" min={1} value={form.adults} onChange={(e) => set("adults", Number(e.target.value))} /></Field>
          <Field label="Bolalar"><TextInput type="number" min={0} value={form.children} onChange={(e) => set("children", Number(e.target.value))} /></Field>
          <Field label="Xona">
            <SelectInput value={form.roomId} onChange={(e) => { set("roomId", e.target.value); setPriceTouched(false); const r = rooms.find((x) => x.id === e.target.value); set("price", priceForType(r.type)); }}>
              {rooms.map((r) => <option key={r.id} value={r.id}>{r.number} · {typeLabel(r.type)}</option>)}
            </SelectInput>
          </Field>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Kechalik narx, so'm"><TextInput type="number" min={0} step="1000" value={form.price} onChange={(e) => { setPriceTouched(true); set("price", e.target.value); }} /></Field>
          <Field label="Bron manbasi">
            <SelectInput value={form.source} onChange={(e) => set("source", e.target.value)}>
              {Object.entries(SOURCES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
            </SelectInput>
          </Field>
        </div>

        {/* Chegirma sababi — faqat narx tarifdan past bo'lsa.
            Backend ham shu qoidani tekshiradi: sababsiz past narx
            rad etiladi. Maydon shu yerda
            ko'rinmasa, xodim tushunarsiz xato olardi. */}
        {isDiscounted && (
          <Field label={"Chegirma sababi (tarif " + (stayTariff ? money(stayTariff.total) + " / " + nights + " kecha" : money(tariffPrice)) + ")"}>
            <TextInput
              value={form.priceReason}
              onChange={(e) => set("priceReason", e.target.value)}
              placeholder="Doimiy mijoz, guruh, kelishuv..."
            />
          </Field>
        )}
        <label className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer select-none">
          <input type="checkbox" checked={form.withMeal} onChange={(e) => set("withMeal", e.target.checked)}
            className="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
          <ChefHat size={15} className="text-gray-500" /> Ovqat bilan
        </label>
        {form.withMeal && mealPrice === 0 && (
          <div className="flex items-center gap-2 text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-md px-2.5 py-2">
            <AlertTriangle size={13} /> Nonushta narxi belgilanmagan — admin panel → Oshxona bo'limida kiriting.
          </div>
        )}
        <Field label="Hozir to'langan, so'm"><TextInput type="number" min={0} step="1000" value={form.paid} onChange={(e) => set("paid", e.target.value)} /></Field>
        <Field label="Izoh"><textarea value={form.notes} onChange={(e) => set("notes", e.target.value)} rows={2} className={inputCls} /></Field>

        {!available && (
          <div className="flex items-center gap-2 text-xs text-red-600 bg-red-50 border border-red-200 rounded-md px-2.5 py-2">
            <AlertTriangle size={14} /> Xona to'qnashuvi — bu xona ushbu sanalarning bir qismida allaqachon band.
          </div>
        )}

        <div className="rounded-md bg-gray-50 border border-gray-200 p-2.5 space-y-1 text-sm">
          <div className="flex justify-between">
            <span className="text-gray-500">{nights} kecha × {money(form.price || 0)}</span>
            <span className="font-mono">{money(roomTotal)}</span>
          </div>
          {mealTotal > 0 && (
            <div className="flex justify-between">
              <span className="text-gray-500">Nonushta: {guests} kishi × {nights} kecha × {money(mealPrice)}</span>
              <span className="font-mono">{money(mealTotal)}</span>
            </div>
          )}
          <div className="flex justify-between border-t border-gray-200 pt-1">
            <span className="text-gray-700 font-medium">Jami</span>
            <span className="font-mono font-semibold">{money(total)}</span>
          </div>
        </div>
      </div>
    </Modal>
  );
}

/* ============================== SUMMA ============================== */

/* Bron summasi (Q15). So'm bron — oddiy "450 000 so'm". Beds24'dan
   kelgan dollar bron — "$120.00" va TAGIDA so'm: bron kelgan kundagi
   kurs bilan (backend `res.base`, lib/money.ts). `base` berilmasa
   bron kursi bilan hisoblanadi; kurs hali yo'q — "kurs kutilmoqda". */
function Amount({ n, res, base, className = "" }) {
  if (!res || isSom(res)) return <span className={`font-mono ${className}`}>{money(n, "UZS")}</span>;
  const rate = Number(res.exchangeRate) || 0;
  const som = base != null ? base : rate > 0 ? Number(n) * rate : null;
  return (
    <span className={`font-mono inline-flex flex-col items-end text-right leading-tight ${className}`}>
      <span>{money(n, res.currency)}</span>
      <span className="text-xs font-normal text-gray-400">{som != null ? money(som, "UZS") : "kurs kutilmoqda"}</span>
    </span>
  );
}

/* ============================== BEDS24 HOLATI ==============================
 *
 * Bron oynasida, Beds24 ulangan bo'lsa: yuborildi / kutmoqda / rad
 * etildi (sababi bilan). Rad etilgan bron AVTOMATIK qayta yuborilmaydi
 * (Beds24 ustuvor — o'sha sanada joy yo'q): xona yoki sanani
 * o'zgartirib yoki bekor qilib hal qilinadi, "Qayta yuborish" — egasi
 * va adminga.
 */
const SYNC_LABEL = {
  synced: ["Beds24'ga yuborilgan", "text-emerald-700 bg-emerald-50 border-emerald-200"],
  pending: ["Beds24'ga yuborilmoqda", "text-gray-600 bg-gray-50 border-gray-200"],
  syncing: ["Beds24'ga yuborilmoqda", "text-gray-600 bg-gray-50 border-gray-200"],
  failed: ["Beds24'ga yuborilmadi — qayta uriniladi", "text-amber-700 bg-amber-50 border-amber-200"],
  rejected: ["Beds24 rad etdi", "text-red-700 bg-red-50 border-red-200"],
  not_applicable: ["Beds24'ga yuborilmaydi", "text-gray-600 bg-gray-50 border-gray-200"],
};

function ChannelSyncInfo({ res, onResync, onRefresh }) {
  const ch = useChannel();
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [note, setNote] = useState(null);
  if (!ch.connected && !res.externalReservationId) return null;

  const fromChannel = res.origin === "channel";
  const [label, cls] = fromChannel && res.syncStatus === "synced"
    ? ["Beds24'dan kelgan", "text-blue-800 bg-blue-50 border-blue-200"]
    : SYNC_LABEL[res.syncStatus] || [res.syncStatus, "text-gray-600 bg-gray-50 border-gray-200"];
  const retryable = ch.connected && ch.canResync && ["failed", "rejected", "pending"].includes(res.syncStatus);

  const retry = async () => {
    setBusy(true); setErr(null); setNote(null);
    try { await onResync(); } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };
  // Beds24'dan qayta olish — Beds24 bilan bog'langan bronda, egasi va adminga
  const refreshable = ch.connected && ch.canResync && !!res.externalReservationId && !!onRefresh;
  const refresh = async () => {
    setBusy(true); setErr(null); setNote(null);
    try {
      const r = await onRefresh();
      if (r && r.status !== "processed") setNote(r.detail);
    } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };

  return (
    <div className={`rounded-md border px-2.5 py-2 text-xs space-y-1.5 ${cls}`}>
      <div className="flex items-center justify-between gap-2">
        <span className="font-semibold">{label}</span>
        {res.externalReservationId && <span className="font-mono opacity-80">Beds24 #{res.externalReservationId}</span>}
      </div>
      {res.syncError && res.syncStatus !== "synced" && <div>{res.syncError}</div>}
      {(retryable || refreshable) && (
        <div className="flex flex-wrap gap-1.5">
          {retryable && (
            <Btn variant="subtle" onClick={retry} disabled={busy}><RotateCcw size={12} /> {busy ? "Yuborilmoqda…" : "Qayta yuborish"}</Btn>
          )}
          {refreshable && (
            <Btn variant="subtle" onClick={refresh} disabled={busy} title="Bron Beds24'dagi holatga keltiriladi"><RotateCcw size={12} /> Beds24'dan yangilash</Btn>
          )}
        </div>
      )}
      {note && <div>{note}</div>}
      {err && <div className="text-red-600">{err}</div>}
    </div>
  );
}

function PaymentModal({ res, onClose, onAdd }) {
  /* Backend hisoblagan summa: nonushta va bekor qilish jarimasi
     ham kiradi — resMoney() */
  const { remaining } = resMoney(res);
  const cur = String(res.currency || "UZS").toUpperCase();
  const foreign = cur !== "UZS";
  const curSign = cur === "USD" ? "$" : cur;
  // Dollar bron (Q15, 2026-09-27): mehmon so'mda to'laydi — BRON kelgan
  // kundagi kurs bilan dollarga o'giriladi (backend hisoblaydi, bu yerda
  // faqat oldindan ko'rsatiladi). Bron kursi hali yo'q bo'lsa — bugungi
  const [fx, setFx] = useState(null);
  useEffect(() => {
    if (!foreign || res.exchangeRate) return;
    api.fxRate(cur).then(setFx).catch(() => setFx({ rate: null }));
  }, [cur, foreign, res.exchangeRate]);
  const rate = !foreign ? null : Number(res.exchangeRate) || (fx && fx.rate ? Number(fx.rate) : null);
  const somDue = rate ? Math.round(remaining * rate) : null;

  const [payCur, setPayCur] = useState(foreign && rate ? "UZS" : cur);
  const [amount, setAmount] = useState(foreign && rate ? Math.round(remaining * rate) : remaining);
  const [touched, setTouched] = useState(false);
  const [method, setMethod] = useState("Naqd");
  const [note, setNote] = useState("");

  // Kurs keyin kelsa (bugungi kurs so'rovi) — standart: so'mda
  useEffect(() => {
    if (foreign && rate && !touched) { setPayCur("UZS"); setAmount(Math.round(remaining * rate)); }
  }, [foreign, rate]); // eslint-disable-line

  const inSom = foreign && payCur === "UZS";
  const converted = inSom && rate ? round2(Number(amount || 0) / rate) : null;

  function switchCur(next) {
    setTouched(true);
    setPayCur(next);
    setAmount(next === "UZS" ? (somDue ?? 0) : remaining);
  }

  return (
    <Modal title="To'lov qo'shish" subtitle={res.guestName} onClose={onClose} width={400}
      footer={<><Btn onClick={onClose}>Bekor qilish</Btn><Btn variant="primary" disabled={!amount || amount <= 0} onClick={() => onAdd(amount, method, note, inSom ? "UZS" : undefined)}>To'lov qo'shish</Btn></>}>
      <div className="space-y-3">
        <div className="text-xs text-gray-500">
          Qolgan qarz: <span className="font-mono font-semibold text-gray-800">{money(remaining, cur)}</span>
          {foreign && somDue != null && <> = <span className="font-mono font-semibold text-gray-800">{money(somDue, "UZS")}</span> ({res.exchangeRate ? "bron kursi" : "bugungi kurs"} {fmtRate(rate)})</>}
        </div>
        {foreign && (
          /* <Field> emas: u <label> — ichidagi ikki tugma bitta nom olib qolardi */
          <div role="group" aria-label="To'lov valyutasi">
            <span className="block text-xs font-medium uppercase tracking-wide text-gray-500 mb-1">To'lov valyutasi</span>
            <div className="flex gap-2">
              <Btn aria-pressed={inSom} variant={inSom ? "primary" : "default"} disabled={!rate} onClick={() => switchCur("UZS")}>So'm</Btn>
              <Btn aria-pressed={payCur === cur} variant={payCur === cur ? "primary" : "default"} onClick={() => switchCur(cur)}>{curSign} {cur === "USD" ? "Dollar" : cur}</Btn>
            </div>
            {fx && !rate && <div className="text-xs text-amber-700 mt-1">Kurs olinmadi — to'lovni {curSign} da kiriting.</div>}
          </div>
        )}
        <Field label={inSom || !foreign ? "Summa, so'm" : `Summa, ${curSign}`}>
          <TextInput type="number" min={0} step={inSom || !foreign ? "1000" : "0.01"} value={amount}
            onChange={(e) => { setTouched(true); setAmount(Number(e.target.value)); }} />
        </Field>
        {converted !== null && (
          <div className="text-xs text-gray-500">Qarzdan ayriladi: <span className="font-mono font-semibold text-gray-800">{money(converted, cur)}</span> (kurs {fmtRate(rate)})</div>
        )}
        <Field label="To'lov usuli">
          <SelectInput value={method} onChange={(e) => setMethod(e.target.value)}>
            {PAYMENT_METHODS.map((m) => <option key={m} value={m}>{m}</option>)}
          </SelectInput>
        </Field>
        <Field label="Izoh (ixtiyoriy)"><TextInput value={note} onChange={(e) => setNote(e.target.value)} /></Field>
      </div>
    </Modal>
  );
}

        <div className="flex justify-between border-t border-gray-100 pt-2"><span className="text-gray-500">Jami</span><Amount n={total} res={res} base={res.base?.total} className="font-semibold" /></div>
        <div className="flex justify-between"><span className="text-gray-500">To'langan</span><Amount n={paid} res={res} base={res.base?.paid} /></div>
        <div className={`flex justify-between font-semibold border-t border-gray-100 pt-2 ${remaining > 0 ? "text-red-600" : "text-emerald-600"}`}>
          <span>Qolgan qarz</span><Amount n={remaining} res={res} base={res.base?.remaining} />
        </div>
        {remaining > 0 && (
          <div className="flex items-center gap-2 text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-md px-2.5 py-2">
            <AlertTriangle size={13} /> Mehmonning {money(remaining, res.currency)} qarzi bor. Chiqishni tasdiqlab, keyinroq hisob-kitob qilishingiz mumkin.
          </div>
        )}
      </div>
    </Modal>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
