# ============================================================
#  hotel — Imron Hotel PMS (nginx)
#  Fayl: /etc/nginx/sites-available/proj-hotel
#  {{DOMAIN}} va {{PORT}} o'rnatishda almashtiriladi (SERVER.md).
#  SSL: certbot --nginx -d {{DOMAIN}} (443 bloklarini certbot qo'shadi)
# ============================================================

# WebSocket: Upgrade bo'lsa "upgrade", bo'lmasa oddiy keep-alive
map $http_upgrade $hotel_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    # Xodim rasmi JSON ichida (data-URL, 2 MB gacha)
    client_max_body_size 5m;

    # Brauzer keyingi safar faqat HTTPS bilan ochsin (HTTP javobida e'tiborsiz)
    add_header Strict-Transport-Security "max-age=31536000" always;

    # sezgir fayllarni yopish
    location ~ /\.                     { deny all; return 404; }
    location ~* \.(env|log|bak|sql)$   { deny all; return 404; }

    # Real-time (Shaxmatka, admin panel) — uzoq ulanish.
    # Brauzer WebSocket'ga sarlavha qo'sha olmaydi, JWT URL'da
    # (`?token=`) keladi — access log'ga tushmasin
    location /ws {
        access_log off;
        proxy_pass         http://127.0.0.1:{{PORT}};
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $hotel_connection;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass         http://127.0.0.1:{{PORT}};
        proxy_http_version 1.1;
        proxy_set_header   Connection        '';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/proj-hotel.access.log;
    error_log  /var/log/nginx/proj-hotel.error.log;
}
